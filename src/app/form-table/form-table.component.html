<table mat-table [dataSource]="formDataArray">
    <ng-container matColumnDef="subNo">
        <th mat-header-cell *matHeaderCellDef>No.</th>
        <td mat-cell *matCellDef="let element">{{element.subNo}}</td>
    </ng-container>
    <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let element">{{element.date}}</td>
    </ng-container>
    <ng-container matColumnDef="jobTitle">
        <th mat-header-cell *matHeaderCellDef>Job Title</th>
        <td mat-cell *matCellDef="let element">{{element.jobTitle}}</td>
    </ng-container>
    <ng-container matColumnDef="managerName">
        <th mat-header-cell *matHeaderCellDef>Manager's Name</th>
        <td mat-cell *matCellDef="let element">{{element.managerName}}</td>
    </ng-container>
    <ng-container matColumnDef="managerEmail">
        <th mat-header-cell *matHeaderCellDef>Manager's Email</th>
        <td mat-cell *matCellDef="let element">{{element.managerEmail}}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row;columns:displayedColumns;"></tr>
</table>
